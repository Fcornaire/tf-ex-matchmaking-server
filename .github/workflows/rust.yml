name: Release
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      ARCHIVE: tf-ex-matchmaking-server-${{ github.ref_name }}-windows-x64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path target/release/tf-ex-matchmaking-server.exe, README.md, LICENSE -DestinationPath $env:ARCHIVE
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
